name: ragaa
description: RAGAA central collection accounting system
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  shared_preferences: ^2.3.2
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4
  sqlite3: ^2.4.7
  sqlite3_flutter_libs: ^0.5.26
  path: ^1.9.0
  path_provider: ^2.1.5
  file_selector: ^1.0.3
  printing: ^5.13.4
  pdf: ^3.11.1
  excel: ^4.0.6
  archive: ^3.6.1
  crypto: ^3.0.6
  share_plus: ^10.1.4
  # Android's Storage Access Framework: the only permission-free way to let the
  # operator choose the folder and file name of an export. Pinned, because the
  # 3.1 line needs a newer Dart SDK than this project targets.
  flutter_file_dialog: 3.0.3
  # Opens the saved PDF/Excel in the viewer the phone already has.
  open_filex: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/Amiri-Regular.ttf
    - assets/fonts/Amiri-Bold.ttf
    - assets/fonts/Tajawal-Regular.ttf
    - assets/fonts/Tajawal-Bold.ttf
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
